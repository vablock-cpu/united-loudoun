function bufferLine(coords, feetPerSide) {
  // Convert feet to approximate degrees at this latitude (~39°N)
  const latCenter = 39.0;
  const metersPerDegLat = 111139;
  const metersPerDegLng = 111139 * Math.cos(latCenter * Math.PI / 180);
  const feetPerMeter = 3.28084;
  const metersPerSide = feetPerSide / feetPerMeter;
  const dLat = metersPerSide / metersPerDegLat;
  const dLng = metersPerSide / metersPerDegLng;

  const left = [];
  const right = [];

  for (let i = 0; i < coords.length; i++) {
    let dx, dy;
    if (i === 0) {
      dy = coords[1][0] - coords[0][0];
      dx = coords[1][1] - coords[0][1];
    } else if (i === coords.length - 1) {
      dy = coords[i][0] - coords[i-1][0];
      dx = coords[i][1] - coords[i-1][1];
    } else {
      dy = coords[i+1][0] - coords[i-1][0];
      dx = coords[i+1][1] - coords[i-1][1];
    }
    const len = Math.sqrt(dx*dx + dy*dy);
    if (len === 0) continue;
    // Perpendicular unit vector scaled to offset
    const px = -dy / len * dLng;
    const py = dx / len * dLat;

    left.push([coords[i][0] + py, coords[i][1] + px]);
    right.push([coords[i][0] - py, coords[i][1] - px]);
  }

  right.reverse();
  return [...left, ...right, left[0]];
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000; // meters
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

  }
});

// ROW toggle
let rowVisible = true;
function toggleROW() {
  const btn = document.getElementById('rowBtn');
  if (rowVisible) {
    map.removeLayer(rowSeg0); map.removeLayer(rowSeg1); map.removeLayer(rowSeg2);
    btn.textContent = "150' ROW";
    btn.classList.add('off');
  } else {
    rowSeg0.addTo(map); rowSeg1.addTo(map); rowSeg2.addTo(map);
    btn.textContent = "150' ROW ✓";
    btn.classList.remove('off');
  }
  rowVisible = !rowVisible;
}

// Fit bounds to all segments
const allPoints = [...seg0, ...seg1, ...seg2];
const bounds = L.latLngBounds(allPoints);
map.fitBounds(bounds, { padding: [50, 50] });

// Set initial active button
document.querySelector('[data-layer="mapbox"]').classList.add('active');
</script>
</body>
