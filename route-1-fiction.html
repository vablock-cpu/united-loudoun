  const feetPerMeter = 3.28084;
  const metersPerSide = feetPerSide / feetPerMeter;
  const dLat = metersPerSide / metersPerDegLat;
  const dLng = metersPerSide / metersPerDegLng;

  const left = [];
  const right = [];

  for (let i = 0; i < coords.length; i++) {
    let dx, dy;
    if (i === 0) {
      dy = coords[1][0] - coords[0][0];
      dx = coords[1][1] - coords[0][1];
    } else if (i === coords.length - 1) {
      dy = coords[i][0] - coords[i-1][0];
      dx = coords[i][1] - coords[i-1][1];
    } else {
      dy = coords[i+1][0] - coords[i-1][0];
      dx = coords[i+1][1] - coords[i-1][1];
    }
    const len = Math.sqrt(dx*dx + dy*dy);
    if (len === 0) continue;
    // Perpendicular unit vector scaled to offset
    const px = -dy / len * dLng;
    const py = dx / len * dLat;

    left.push([coords[i][0] + py, coords[i][1] + px]);
    right.push([coords[i][0] - py, coords[i][1] - px]);
  }

  right.reverse();
  return [...left, ...right, left[0]];
}

const rowStyle = {

  weight: 3,
  opacity: 0.9,
  fillColor: '#ff3264',
  fillOpacity: 0.15

// Connector segments - orange
const connectorStyle = {

// --- Dominion comparison routes (from northernvaprojects.com) ---
const domColors = {
  'R1': '#00bfff', 'R2': '#00ff88', 'R3': '#ffaa00',
  'R3A': '#ff6600', 'R4': '#aa44ff', 'R5': '#ffff00', 'Soj': '#00ffff'
};
const domData = {
  'R1': clean_route_1, 'R2': clean_route_2, 'R3': clean_route_3,
  'R3A': clean_route_3a, 'R4': clean_route_4, 'R5': clean_route_5, 'Soj': clean_sojourney_loop
};
const domLabels = {
  'R1': 'Route 1', 'R2': 'Route 2', 'R3': 'Route 3',
  'R3A': 'Route 3A', 'R4': 'Route 4', 'R5': 'Route 5', 'Soj': 'Sojourney Loop'
};
const domLayers = {};

// domData values are now arrays of segments (pre-split, no gaps)
for (const [key, segments] of Object.entries(domData)) {
  const layers = [];
  segments.forEach(s => {
    if (s.length >= 2) {
      // ROW buffer per segment
      layers.push(L.polygon(bufferLine(s, 50), {
        color: domColors[key], weight: 1.5, opacity: 0.4,
        fillColor: domColors[key], fillOpacity: 0.08
      }));
      // Centerline per segment
      layers.push(L.polyline(s, {
        color: domColors[key], weight: 3, opacity: 0.8, lineJoin: 'round', dashArray: '8, 5'
      }).bindPopup('<b>' + domLabels[key] + '</b><br>100\' ROW · Source: northernvaprojects.com'));
    }
  });
  domLayers[key] = L.layerGroup(layers);
}

function toggleDomRoute(key) {
  const btn = document.getElementById('dom-' + key);
  if (map.hasLayer(domLayers[key])) {
    map.removeLayer(domLayers[key]);
    btn.style.opacity = '0.4';
    btn.style.borderColor = 'rgba(255,255,255,0.12)';
  } else {
    domLayers[key].addTo(map);
    btn.style.opacity = '1';
    btn.style.borderColor = domColors[key];
  }
}

function showAllDomRoutes() {
  for (const key of Object.keys(domLayers)) {
    domLayers[key].addTo(map);
    const btn = document.getElementById('dom-' + key);
    btn.style.opacity = '1';
    btn.style.borderColor = domColors[key];
  }
}

function hideAllDomRoutes() {
  for (const key of Object.keys(domLayers)) {
    map.removeLayer(domLayers[key]);
    const btn = document.getElementById('dom-' + key);
    btn.style.opacity = '0.4';
    btn.style.borderColor = 'rgba(255,255,255,0.12)';
  }
}

for (const [key, color] of Object.entries(domColors)) {
  const btn = document.createElement('button');
  btn.id = 'dom-' + key;
  btn.className = 'route-toggle-btn';
  btn.style.borderColor = 'rgba(255,255,255,0.12)';

  routePanel.appendChild(btn);
}

// Substation markers
const substationIcon = (label) => L.divIcon({

});

// Mars Substation - southern end (near Old Ox Rd / W Perimeter Rd, by Dulles)

// --- Measure tool ---
let measuring = false;
let measurePoints = [];
let measureMarkers = [];
let measureLine = null;
let measureLabel = null;

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000; // meters
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function clearMeasure() {
  measureMarkers.forEach(m => map.removeLayer(m));
  measureMarkers = [];
  measurePoints = [];
  if (measureLine) { map.removeLayer(measureLine); measureLine = null; }
  if (measureLabel) { map.removeLayer(measureLabel); measureLabel = null; }
  document.getElementById('measureResult').style.display = 'none';
}

function toggleMeasure() {
  measuring = !measuring;
  const btn = document.getElementById('measureBtn');
  if (measuring) {
    btn.classList.add('active');
    btn.textContent = '📏 Click 2 points';
    clearMeasure();
    map.getContainer().style.cursor = 'crosshair';
  } else {
    btn.classList.remove('active');
    btn.textContent = '📏 Measure';
    clearMeasure();
    map.getContainer().style.cursor = '';
  }
}

const measureDot = (color) => L.divIcon({
  html: '<div style="background:' + color + ';width:10px;height:10px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px rgba(0,180,255,0.6);"></div>',
  iconSize: [10, 10],
  iconAnchor: [5, 5]
});

map.on('click', function(e) {
  if (!measuring) return;

  if (measurePoints.length >= 2) {
    clearMeasure();
  }

  measurePoints.push(e.latlng);
  measureMarkers.push(L.marker(e.latlng, { icon: measureDot('#00b4ff') }).addTo(map));

  if (measurePoints.length === 2) {
    const p1 = measurePoints[0];
    const p2 = measurePoints[1];
    const meters = haversine(p1.lat, p1.lng, p2.lat, p2.lng);
    const feet = meters * 3.28084;

    measureLine = L.polyline([p1, p2], {
      color: '#00b4ff',
      weight: 2,
      opacity: 0.9,
      dashArray: '6, 4'
    }).addTo(map);

    // Label at midpoint
    const mid = L.latLng((p1.lat + p2.lat)/2, (p1.lng + p2.lng)/2);
    measureLabel = L.marker(mid, {
      icon: L.divIcon({
        html: '<div style="background:rgba(0,0,0,0.85);color:#00b4ff;padding:3px 8px;border-radius:4px;font-size:12px;font-weight:700;font-family:DM Sans,sans-serif;white-space:nowrap;border:1px solid rgba(0,180,255,0.4);">' + feet.toFixed(0) + ' ft (' + meters.toFixed(1) + ' m)</div>',
        iconSize: [0, 0],
        iconAnchor: [0, 12]
      })
    }).addTo(map);

    const result = document.getElementById('measureResult');
    result.textContent = feet.toFixed(0) + ' ft (' + meters.toFixed(1) + ' m)';
    result.style.display = 'block';
  }
});

// Fit bounds to all segments
const allPoints = [...seg0, ...seg1, ...seg2];
const bounds = L.latLngBounds(allPoints);
map.fitBounds(bounds, { padding: [50, 50] });

// Set initial active button
document.querySelector('[data-layer="mapbox"]').classList.add('active');
</script>
