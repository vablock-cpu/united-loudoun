<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route Comparison Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<style>
body, html, #map { margin: 0; padding: 0; width: 100%; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif; }
#header { position: fixed; top: 0; left: 0; right: 0; background: white; padding: 12px 16px; border-bottom: 1px solid #ddd; z-index: 2000; }
#header h1 { margin: 0; font-size: 16px; font-weight: 600; color: #1a1a1a; }
#header p { margin: 4px 0 0 0; font-size: 12px; color: #555; line-height: 1.5; }
#header a { color: #0066cc; text-decoration: none; }

#controls { position: fixed; top: 80px; left: 12px; background: white; border: 1px solid #ddd; padding: 12px; border-radius: 4px; z-index: 1000; font-size: 12px; width: auto; }
#controls h3 { margin: 0 0 8px 0; font-size: 12px; font-weight: 600; }
#controls label { display: block; margin: 6px 0; cursor: pointer; }
#controls input { margin-right: 6px; }

@media print {
  #controls { display: none !important; visibility: hidden !important; }
  #header { position: static !important; margin-bottom: 20px; }

<div id="header">
  <h1>Golden to Mars - 606 Corridor NOAA Route</h1>
  <p>Mars Substation via NOAA to 606 at Ladbrook Rd - follows Westwind Drive extension under construction to proposed routes 3 & 4 and existing 230kV lines<br/><a href="https://www.loudoun.gov/5498/Westwind-Drive" target="_blank">loudoun.gov/5498/Westwind-Drive</a></p>
</div>

<div id="controls">
  <h3 style="margin-top:0;">Routes</h3>
  <div style="font-size:11px;line-height:1.6;">
    <label style="display:flex;align-items:center;margin:6px 0;"><input type="checkbox" id="proposal" checked style="margin-right:6px;"> <span style="display:inline-block;width:10px;height:10px;background:#FF6B35;border-radius:2px;margin-right:6px;"></span>Proposal</label>
    <label style="display:flex;align-items:center;margin:6px 0;"><input type="checkbox" id="route3a" checked style="margin-right:6px;"> <span style="display:inline-block;width:10px;height:10px;background:#FF0000;border-radius:2px;margin-right:6px;"></span>Route 3A</label>
    <label style="display:flex;align-items:center;margin:6px 0;"><input type="checkbox" id="route4" checked style="margin-right:6px;"> <span style="display:inline-block;width:10px;height:10px;background:#0033FF;border-radius:2px;margin-right:6px;"></span>Route 4</label>
    <label style="display:flex;align-items:center;margin:6px 0;"><input type="checkbox" id="route3" checked style="margin-right:6px;"> <span style="display:inline-block;width:10px;height:10px;background:#22DD22;border-radius:2px;margin-right:6px;"></span>Route 3</label>
  </div>

  <button onclick="map.zoomIn()" style="display:block;width:100%;padding:10px;margin-top:12px;margin-bottom:6px;background:#000;border:none;color:white;border-radius:4px;cursor:pointer;font-weight:600;font-size:13px;">Zoom In</button>
  <button onclick="map.zoomOut()" style="display:block;width:100%;padding:10px;background:#000;border:none;color:white;border-radius:4px;cursor:pointer;font-weight:600;font-size:13px;">Zoom Out</button>
</div>

<div id="map"></div>

});

});

// Fit bounds
const allCoords = [...mergedRoute, ...route3, ...route3a, ...route4];
map.fitBounds(L.latLngBounds(allCoords), {padding:[80,80]});

</html>
