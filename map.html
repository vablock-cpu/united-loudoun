  const dLat = metersPerSide / metersPerDegLat;
  const dLng = metersPerSide / metersPerDegLng;

  const left = [];
  const right = [];

  for (let i = 0; i < coords.length; i++) {
    let dx, dy;
    if (i === 0) {
      dy = coords[1][0] - coords[0][0];
      dx = coords[1][1] - coords[0][1];
    } else if (i === coords.length - 1) {
      dy = coords[i][0] - coords[i-1][0];
      dx = coords[i][1] - coords[i-1][1];
    } else {
      dy = coords[i+1][0] - coords[i-1][0];
      dx = coords[i+1][1] - coords[i-1][1];
    }
    const len = Math.sqrt(dx*dx + dy*dy);
    if (len === 0) continue;
    // Perpendicular unit vector scaled to offset
    const px = -dy / len * dLng;
    const py = dx / len * dLat;

    left.push([coords[i][0] + py, coords[i][1] + px]);
    right.push([coords[i][0] - py, coords[i][1] - px]);
  }

  right.reverse();
  return [...left, ...right, left[0]];
}

let measuring = false;

let measureMarkers = [];
let measureLine = null;
let measureLabel = null;

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000; // meters
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function clearMeasure() {
  measureMarkers.forEach(m => map.removeLayer(m));
  measureMarkers = [];
  measurePoints = [];
  if (measureLine) { map.removeLayer(measureLine); measureLine = null; }

  document.getElementById('measureResult').style.display = 'none';
}

    const meters = haversine(p1.lat, p1.lng, p2.lat, p2.lng);

      })
    }).addTo(map);

    const result = document.getElementById('measureResult');
    result.textContent = feet.toFixed(0) + ' ft (' + meters.toFixed(1) + ' m)';
    result.style.display = 'block';
  }
});

const easementLabels = {
  "122178940000": { name: "Loudoun County BOS Controlled (Existing Conservation Easement)", short: "BOS Controlled", color: "#4a90d9" },
  "122497166000": { name: "8th Easement Offered to Loudoun County BOS", short: "8th Offered by LVE to BoS", color: "#f5a623" },
  "122391189000": { name: "Parcel Donated to School Board by LVE", short: "School Board", color: "#7ed957" }
};

const easementLayers = {};
for (const [pin, info] of Object.entries(easementLabels)) {
  const subset = {
    type: "FeatureCollection",
    features: lveEasementParcels.features.filter(f => f.properties && f.properties.PA_MCPI === pin)
  };
  easementLayers[pin] = L.geoJSON(subset, {
    style: () => ({
      color: info.color,
      weight: 2,
      opacity: 0.9,
      fillColor: info.color,
      fillOpacity: 0.12,
      dashArray: "4,3"
    }),
    onEachFeature: (feature, layer) => {
      const p = feature.properties;
      layer.bindPopup(
        '<b>' + info.name + '</b><br>PIN ' + p.PA_MCPI +
        '<br>' + (p.PA_LEGAL_ACRE || '?') + ' ac' +
        '<br>Plat Lot ' + (p.PA_PLAT_LOT || 'N/A')
      );
    }
  });
}

function toggleEasement(pin) {
  const btn = document.getElementById('ease-' + pin);
  const layer = easementLayers[pin];
  const info = easementLabels[pin];
  if (map.hasLayer(layer)) {
    map.removeLayer(layer);
    btn.style.opacity = '0.4';
    btn.style.borderColor = 'rgba(255,255,255,0.12)';
  } else {
    layer.addTo(map);
    btn.style.opacity = '1';
    btn.style.borderColor = info.color;
  }
}

// Build easement panel
const easementPanel = document.getElementById('easementPanel');
for (const [pin, info] of Object.entries(easementLabels)) {
  const btn = document.createElement('button');
  btn.id = 'ease-' + pin;
  btn.className = 'easement-toggle-btn';
  btn.style.color = info.color;
  btn.style.opacity = '0.4';
  btn.style.borderColor = 'rgba(255,255,255,0.12)';
  btn.innerHTML = '<span class="easement-swatch" style="background:' + info.color + ';"></span>' + info.short;
  btn.title = info.name;
  btn.onclick = () => toggleEasement(pin);
  easementPanel.appendChild(btn);
}
